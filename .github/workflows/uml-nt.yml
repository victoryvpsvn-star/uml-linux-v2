name: uml-nt build (all-in-one)

# ONE workflow for the whole uml-nt pipeline — the four former
# per-milestone files merged into a single DAG:
#
#   uml-nt-m0.yml           -> spikes         M0 S1-S6 evidence probes (win)
#   uml-nt-tests.yml        -> unit           model tests + ABI + pin + lint (linux)
#   uml-nt-m3.yml           -> kernel         vmlinux + guest-init.elf + rootfs.ext4 (linux)
#                                            launcher — the native gate battery (win)
#   uml-nt-m55-systemd.yml  -> rootfs-mask    masked bookworm CI copy (linux)
#                                            systemd-boot — the M5.5a/M5.5b referee (win)
#
# One binary, one build: the old m3 and m55 lanes each built their own
# vmlinux and their own launcher.exe + stub.exe on every push — the
# merge builds each exactly once per run and both Windows jobs consume
# the same vmlinux artifact.
#
# Triggers preserve the old split:
#   push uml-nt/**  -> unit + spikes + kernel + launcher (the old
#                      m0+tests+m3 lanes; CI stays fast, no referee);
#   dispatch        -> everything above PLUS systemd-boot, with the
#                      old m55 A/B levers (debugger / veh_window /
#                      feed / xs_lever / probe_off / witness_off);
#   weekly cron     -> the M5.5 plan ("flip to a weekly canary once
#                      multi-user.target is green"): schedule events
#                      only fire on the default branch, so this stays
#                      INERT while the series lives on uml-nt/* and
#                      arms itself the moment it lands on main;
#   vars.UML_NT_BOOT_ON_PUSH == '1' -> the one-switch flip that puts
#                      the referee on every push, no new commit.
# The old m55 "push: paths: [itself]" registration trick is gone —
# this file fires on every push anyway, so the dispatch entry is
# guaranteed.
#
# The referee's contract (verbatim from the m55 lane): boot-failure-
# driven — every run prints the not-implemented syscall table + the
# furthest systemd marker; the gate tightens as clusters land. Gate
# (D21 era): multi-user.target, fallback journald Started (the
# env-poison SIGSEGV flake family still kills ~1/3 of boots
# pre-journald — a red flake run is re-dispatched for sampling, not
# treated as a regression). Rootfs: base-debian-bookworm.img from
# base_image.yml (Debian 12, glibc 2.36 + systemd 252) — downloaded
# from that workflow's artifacts, never committed (hard rule). Wine
# cannot pass the arch_prctl wall (HANDOFF 4.1-11 — the c3 wine boots
# die there, rax=9e, after the whole loader chain maps clean), so
# native is the referee for everything past the guest loader chain.

on:
  push:
    branches: ["uml-nt/**"]
  workflow_dispatch:
    inputs:
      debugger:
        description: "uml_nt_dbg=1 (run stub.exe under the launcher's own mini-debugger)"
        type: boolean
        default: false
      veh_window:
        description: 'Refined A/B: remove the vectored handler for the first 4s of a login conn'
        type: boolean
        default: false
      feed:
        description: "feed the console at all (false = diagnostic A/B: is the input path the killer?)"
        type: boolean
        default: true
      xs_lever:
        description: "drop CONTEXT_XSTATE for the login chain only (ruling 223 A/B)"
        type: boolean
        default: false
      probe_off:
        description: "append uml_nt_drexec=0 (A/B: the DR-execute probe off)"
        type: boolean
        default: false
      witness_off:
        description: "append uml_nt_witness=0 (exonerate guest-visible witnesses)"
        type: boolean
        default: false
  schedule:
    # Weekly canary (Mon 04:00 UTC) — inert until the series lands on
    # the default branch; see the header.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  actions: read

jobs:

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (pure logic, no network)
        run: |
          bash uml-nt/tests/test_fetch.sh
          bash uml-nt/tests/test_os_windows_skeleton.sh
          bash uml-nt/tests/test_scan_patch.sh
          bash uml-nt/tests/test_mm.sh
          # 100-real-alpine: console-status classifier — the stdin
          # reader must survive the spurious WAIT_1-class wakes
          bash uml-nt/tests/test_console.sh
          # M5.6a slice D: the replay single-step (TF) state machine
          bash uml-nt/tests/test_ss.sh
          # M5.6a D28 (Shelley lazy-file ruling): the demand-paged
          # file-VMA run window + file read clamp.
          bash uml-nt/tests/test_lazyfile.sh
          # M5.6a D28 follow-up: the run-keyed kernel->guest write ledger
          # the [imgwatch] fire scans (writer identification).
          bash uml-nt/tests/test_writeledger.sh
          # M5.6a writer-hunt follow-up (Shelley 148-UPDATE 3/4): the
          # trap -> resume boundary contract — only the ud2 sentinel is
          # a syscall; every resume lands on the claimed boundary.
          bash uml-nt/tests/test_resume.sh
          # M5.6a login-depth follow-up (Shelley 148-UPDATE 9/10): the
          # guest TLS pointer-guard contract — PTR_MANGLE arithmetic,
          # guard-stability verdict, AT_RANDOM -> TCB derivation.
          bash uml-nt/tests/test_guard.sh
          # M3.7 uaccess walker (D15) over the vma tree
          bash uml-nt/tests/test_uaccess.sh
          # M4.1 bench stats — the pure math the freestanding kernel
          # ships must match the host test (sort/percentile/mean/eps)
          bash uml-nt/tests/test_bench.sh
          # M3.4 guest ELF loader — the real-fixture build needs lld
          # (same clang+lld recipe as the kernel job's guest build).
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y lld llvm
          fi
          bash uml-nt/tests/test_elf.sh
          # M3.8 S4c: the rootfs now carries /bin/step2 (the exec-
          # chain proof binary) built from ../guest/step2.c — build
          # the guest targets before the image, same order as the
          # kernel job.
          make -C uml-nt/guest CC=clang LD=ld.lld
          # M3.5 gate rootfs — static freestanding /sbin/init + ext4
          # image (mke2fs -d, no root). Same recipe the kernel job's
          # mount gate consumes. S4c2: the image also carries busybox
          # (built from source, musl-gcc) — install musl-tools first.
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y musl-tools
          fi
          make -C uml-nt/rootfs
          debugfs -R "ls -l /sbin" uml-nt/rootfs/rootfs.ext4
          debugfs -R "ls -l /bin" uml-nt/rootfs/rootfs.ext4

      - name: ntabi ABI checks (ELF freestanding + mingw PE)
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          bash uml-nt/tests/test_ntabi.sh

      - name: Pin check (network, cheap — validates tarball + file URLs + sha256 pin)
        run: bash uml-nt/kernel/fetch.sh check

      - name: Lint shell
        run: |
          shellcheck -x uml-nt/kernel/fetch.sh uml-nt/tests/test_fetch.sh \
            uml-nt/tests/test_os_windows_skeleton.sh uml-nt/tests/test_scan_patch.sh \
            uml-nt/tests/test_mm.sh uml-nt/tests/test_elf.sh \
            uml-nt/tests/test_uaccess.sh uml-nt/tests/test_bench.sh \
            uml-nt/tests/test_console.sh uml-nt/tests/test_ss.sh \
            uml-nt/tests/test_lazyfile.sh uml-nt/tests/test_writeledger.sh \
            uml-nt/tests/test_resume.sh uml-nt/tests/test_guard.sh

  spikes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld

      - name: Build spikes
        shell: msys2 {0}
        run: make -C uml-nt/spikes all

      - name: Run S1 — VEH trap/resume
        shell: msys2 {0}
        run: |
          mkdir -p uml-nt/spikes/results
          cd uml-nt/spikes
          ./s1_veh.exe && cat results/s1_veh.json

      - name: Run S2 — cross-process sync
        shell: msys2 {0}
        run: |
          cd uml-nt/spikes
          ./s2_xproc.exe && cat results/s2_xproc.json

      - name: Run S5 — spawn/discard/fixed-map
        shell: msys2 {0}
        run: |
          cd uml-nt/spikes
          ./s5_spawn.exe && cat results/s5_spawn.json

      - name: Run S3+S4 — ELF launcher
        shell: msys2 {0}
        run: |
          cd uml-nt/spikes
          ./s3_launcher.exe payload.elf && cat results/s3_launcher.json

      - name: Run S6 — ud2 scanner (no objdump ground truth on Windows)
        shell: msys2 {0}
        run: |
          cd uml-nt/spikes
          ./s6_scan.exe payload.elf > results/s6_scan.json && cat results/s6_scan.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-spike-results
          path: |
            uml-nt/spikes/results/*.json
          if-no-files-found: warn

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # One bounded apt round (a stuck mirror once ate 17 min of
      # "Install deps" and the run was cancelled): musl-tools for the
      # rootfs busybox and ccache for the kernel ride along here.
      - name: Install deps
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            update -y
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            install -y build-essential flex bison bc patch xz-utils \
            clang lld llvm ccache musl-tools

      # ccache across runs: the tree and O= paths are fixed on the
      # runner, so an overlay-only change recompiles just the touched
      # objects. The key rolls per commit; restore picks the newest.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: uml-nt-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            uml-nt-ccache-${{ runner.os }}-

      - name: Fetch pinned v6.18.56 + apply uml-nt overlay
        run: |
          TREE=$(bash uml-nt/kernel/fetch.sh extract)
          bash uml-nt/kernel/apply.sh "$TREE"
          echo "TREE=$TREE" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # fresh extract = fresh mtimes; hash contents, not stat
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"

      - name: Configure (uml_nt_defconfig, clang+lld)
        run: |
          make -C "$TREE" O="$(pwd)/build" ARCH=um LLVM=1 CC="ccache clang" \
            LD=ld.lld uml_nt_defconfig

      - name: Build vmlinux (clang+lld, ccache)
        run: |
          ccache -z
          make -C "$TREE" O="$(pwd)/build" ARCH=um LLVM=1 CC="ccache clang" \
            LD=ld.lld KBUILD_BUILD_TIMESTAMP="uml-nt" -j"$(nproc)"
          ccache -s

      - name: Freestanding gates (D1/D2)
        run: |
          set -euxo pipefail
          test -f build/vmlinux
          # D1: zero host-libc references may remain undefined or dynamic.
          [ "$(nm -u build/vmlinux | wc -l)" -eq 0 ]
          ! readelf -d build/vmlinux | grep -q NEEDED
          # D2/D9: entry point is our _start (launcher jumps there).
          ENTRY=$(readelf -h build/vmlinux | awk '/Entry point/ {print $4}')
          # readelf prints 0x60022d1f; nm pads to 16 digits — match both.
          nm build/vmlinux | grep -qiE "0*${ENTRY#0x} T _start"

      - name: Upload vmlinux.elf
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build/vmlinux

      # M3.4: the probe guest — a real static ELF64 the kernel-side
      # loader loads (execveat(memfd) analogue). Same toolchain as the
      # kernel build; uploaded for the native launcher job.
      - name: Build probe guest ELF
        run: |
          make -C uml-nt/guest CC=clang LD=ld.lld
          readelf -lW uml-nt/guest/guest-init.elf
          test -f uml-nt/guest/guest-init.elf

      - name: Upload guest-init.elf
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-guest-exec-elf
          path: uml-nt/guest/guest-init.elf

      # M3.5: minimal ext4 root image (static freestanding /sbin/init
      # built from uml-nt/rootfs/init.c, populated via mke2fs -d — no
      # root, no loop device). Uploaded for the native mount gate.
      - name: Build gate rootfs (M3.5)
        run: |
          # musl-gcc (Install deps) builds the image's busybox (S4c2)
          make -C uml-nt/rootfs
          file uml-nt/rootfs/rootfs.ext4

      - name: Upload rootfs.ext4
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-rootfs-ext4
          path: uml-nt/rootfs/rootfs.ext4

  rootfs-mask:
    # The referee's image prep (was the m55 kernel job's second half),
    # pulled into its own job so a missing base-debian-bookworm
    # artifact skips systemd-boot instead of taking the whole
    # build+gates lane down with it. Masking touches the CI COPY
    # only — the canonical base_image artifact stays pristine.
    # Same condition as systemd-boot: on a plain push the masked
    # copy would be uploaded for nobody.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.UML_NT_BOOT_ON_PUSH == '1'
    runs-on: ubuntu-24.04
    steps:
      - name: Download base-debian-bookworm rootfs + mask cloud-init (D21 test-image rule)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest NON-EXPIRED uml-base-debian-bookworm artifact via the
          # artifacts API (`gh run list --workflow` filters by the current
          # git branch and can return a base_image run that never uploaded
          # the artifact — run 36841223033 died on that).
          RID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=uml-base-debian-bookworm&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | .[-1].workflow_run.id')
          echo "artifact lookup: ${RID:-EMPTY}"
          if [ -z "$RID" ]; then
            echo "no live uml-base-debian-bookworm artifact — re-run base_image.yml first" >&2
            exit 1
          fi
          echo "base_image run: $RID"
          gh run download "$RID" -R "${{ github.repository }}" \
            -n uml-base-debian-bookworm -D rootfs-img
          ls -lh rootfs-img
          # D21 test-image rule (ARCHITECTURE.md): cloud-init units are
          # provisioning fluff for this gate and exec python3.11 (6.8MB
          # ET_EXEC at low VAs — the D21 loader blocker: order-11 span >
          # MAX_PAGE_ORDER). Mask = canonical systemd /dev/null symlink in
          # /etc/systemd/system (shadows the unit wherever its wants-dir
          # link lives). D21 lifts these.
          IMG=rootfs-img/base-debian-bookworm.img
          sudo mkdir -p /mnt/m55a-rootfs
          sudo mount -o loop "$IMG" /mnt/m55a-rootfs
          for unit in cloud-init.service cloud-init-local.service \
                      cloud-config.service cloud-final.service \
                      systemd-cloud-init.service; do
            if [ -e "/mnt/m55a-rootfs/lib/systemd/system/$unit" ] \
               || [ -L "/mnt/m55a-rootfs/etc/systemd/system/$unit" ]; then
              sudo ln -sf /dev/null "/mnt/m55a-rootfs/etc/systemd/system/$unit"
              echo "masked: $unit"
            else
              echo "not present, skipped: $unit"
            fi
          done
          echo "--- masked units in /etc/systemd/system ---"
          ls -l /mnt/m55a-rootfs/etc/systemd/system/ | grep -i cloud || true
          # M5.5b-1 (gate 1/3 of the M5.5b milestone, test-image rule):
          # the defconfig has NO CONFIG_VT/UNIX98_PTYS — /dev/tty1
          # cannot exist, so getty@tty1 can only restart-loop. The
          # console IS a real tty on uml-nt (console.c tty_operations +
          # the launcher stdin reader thread), so console-getty on
          # /dev/console is the headless analogue. Enable it, mask the
          # impossible getty@tty1, and set root/root (shadow-override
          # in the CI COPY only — the canonical base_image artifact
          # stays pristine). Deterministic salt so the diff reviews.
          sudo mkdir -p /mnt/m55a-rootfs/etc/systemd/system/getty.target.wants
          sudo ln -sf /lib/systemd/system/console-getty.service \
            /mnt/m55a-rootfs/etc/systemd/system/getty.target.wants/console-getty.service
          sudo ln -sf /dev/null \
            "/mnt/m55a-rootfs/etc/systemd/system/getty@tty1.service"
          HASH=$(openssl passwd -6 -salt umlnt root)
          sudo sed -i "s|^root:[^:]*:|root:${HASH}:|" \
            /mnt/m55a-rootfs/etc/shadow
          # USER ruling 2026-10 (M5.5b-1-AUTO): the death on the password
          # path is not CI-specific — a real machine crashes the same way —
          # and the kernel-mode hunt is deferred. So the milestone gate is
          # reached by autologin: console-getty starts agetty with
          # --autologin root, which skips the password round entirely. The
          # gate grep is untouched: ^LOGIN-OK still has to appear, only the
          # way we get to a shell changed (USER-approved semantics change).
          sudo mkdir -p /mnt/m55a-rootfs/etc/systemd/system/console-getty.service.d
          # Shelley 225: the binary that already runs well up to the
          # password prompt is login itself, so the autologin belongs to it:
          # -f root skips authentication and keeps everything else login
          # does (pam_session, environment, the shell it spawns). agetty is
          # out of the picture — it was exiting before it ever exec'd login.
          printf '%s\n' \
            '[Service]' \
            'ExecStart=' \
            'ExecStart=-/bin/login -f root' \
            'StandardInput=tty' \
            'TTYPath=/dev/console' \
            'Restart=always' \
            'RestartSec=0' \
            | sudo tee /mnt/m55a-rootfs/etc/systemd/system/console-getty.service.d/autologin.conf >/dev/null
          echo "--- M5.5b-1-AUTO autologin override ---"
          cat /mnt/m55a-rootfs/etc/systemd/system/console-getty.service.d/autologin.conf
          echo "--- M5.5b-1 login prep ---"
          ls -l /mnt/m55a-rootfs/etc/systemd/system/getty.target.wants/ || true
          grep "^root:" /mnt/m55a-rootfs/etc/shadow | cut -c1-14
          sudo umount /mnt/m55a-rootfs

      - name: Upload masked rootfs (CI copy)
        uses: actions/upload-artifact@v4
        with:
          name: m55a-rootfs-bookworm-masked
          path: rootfs-img/base-debian-bookworm.img
          retention-days: 3

  launcher:
    # M1.9: NATIVE Windows boot — build launcher.exe with the MSYS2
    # mingw toolchain, download the vmlinux artifact from the kernel
    # job, boot it for real (no wine) and assert the no-rootfs panic.
    needs: kernel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-toolchain

      - name: Build launcher.exe + stub.exe
        shell: msys2 {0}
        run: |
          make -C uml-nt/launcher all
          make -C uml-nt/stub all

      # M3.8 S4c evidence: musl TLS needs arch_prctl(ARCH_SET_FS) —
      # can a user-written FS base exist on native Windows (FSGSBASE
      # enabled, survives VEH round-trips / scheduling)? Evidence
      # probe, not a gate: exit 0 with markers either way; D18 reads
      # the log.
      - name: FSGSBASE probe (S4c evidence)
        shell: msys2 {0}
        run: |
          make -C uml-nt/probes
          ./uml-nt/probes/fsgsbase.exe

      # M4/S4d evidence: FP/XMM state at the VEH trap boundary —
      # capture validity (CONTEXT.FloatSave), dispatcher clobber,
      # writeback stickiness, round-trip fidelity. Decides how the
      # stub captures/restores xstate for guest signals (sigreturn
      # frame fpstate). Evidence probe, not a gate.
      - name: XSTATE probe (S4d evidence)
        shell: msys2 {0}
        run: |
          make -C uml-nt/probes
          ./uml-nt/probes/xstate.exe

      - name: Usage gate (no args → exit 2)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          set +e
          ./launcher.exe; code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }
          echo "launcher usage gate ok"

      - name: Download vmlinux.elf
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build

      - name: Download guest-init.elf (M3.4)
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-guest-exec-elf
          path: guest

      - name: Download rootfs.ext4 (M3.5)
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-rootfs-ext4
          path: rootfs

      - name: NATIVE boot test (M1.9 acceptance + M2 round-trip + M3.1 faults + M3.3 fork + M3.4 ELF loader)
        shell: msys2 {0}
        env:
          # Shelley 254: the access violation never reaches a handler of ours,
          # and a kernel-mode dispatch offers the event to a debugger BEFORE
          # any user-mode handler. With this on, the launcher attaches with
          # create-with-debug and prints every exception record — code,
          # address and thread — so the fault address stops being a guess.
          # Shelley 256: the debugger is kept but off by default — three
          # rounds produced one loader breakpoint and no real event, and the
          # answer-time invariant is the path that needs no exception.
          UML_NT_CIDBG: ${{ vars.UML_NT_CIDBG || '0' }}
        run: |
          cd uml-nt/launcher
          set +e
          DBGARG=""
          if [ "${UML_NT_CIDBG:-0}" = "1" ]; then DBGARG="uml_nt_dbg=1"; fi
          echo "debugger arg: '${DBGARG}'"
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stubtest=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "uml_nt_exec=$(cygpath -w ../../guest/guest-init.elf)" \
            "UML_NT_STACK_FULLCOMMIT=1" \
            ${DBGARG:+$DBGARG} \
            > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          [ "$code" -eq 1 ] || { echo "expected exit 1 (panic), got $code (124 = boot hang — see log)"; exit 1; }
          # M3.5 note: with ext4 + ubd built in, the no-image panic is
          # "Unable to mount root fs" (ext4 present, root=98:0 default).
          grep -q "Unable to mount root fs" boot.log || { echo "boot never reached the no-rootfs panic"; exit 1; }
          grep -q "exec loaded: 3 region" boot.log || { echo "M3.4 ELF loader never ran (no exec image loaded)"; exit 1; }
          grep -q "ROUND-TRIP OK" boot.log || { echo "M2 syscall round-trip never completed"; exit 1; }
          grep -q "^hi" boot.log || { echo "guest write output missing"; exit 1; }
          grep -q "FAULT1-OK" boot.log || { echo "M3.1 fault #1 never recovered"; exit 1; }
          grep -q "FAULT2-OK" boot.log || { echo "M3.1 fault #2 never recovered"; exit 1; }
          grep -q "GUARD0-OK" boot.log || { echo "M3.1 protect did not stick (read-back failed)"; exit 1; }
          grep -q "CHILD-ALIVE" boot.log || { echo "M3.3 fork: child never ran (COW stack fault?)"; exit 1; }
          grep -q "PARENT-RESUMED" boot.log || { echo "M3.3 fork: parent never resumed"; exit 1; }
          grep -q "FORK OK: parent exit 0, child exit 7" boot.log || { echo "M3.3 fork exit codes wrong"; exit 1; }
          # M3.8 S1: the real mm-context lifecycle (init_new_context/
          # destroy_context path) — spawn + destroy a bare suspended
          # stub through uml_nt_mmctx_init/destroy.
          grep -q "MMCTX OK" boot.log || { echo "M3.8 S1 mmctx lifecycle never ran"; exit 1; }
          # M3.6: the real console TTY registers (major 4 tty0) and
          # printk routes through it.
          grep -q "stdio console ready" boot.log || { echo "M3.6 console driver never registered"; exit 1; }
          grep -q "console \[tty0\] enabled" boot.log || { echo "M3.6 tty console never enabled (printk not routed)"; exit 1; }
          # M3.7: the D16 syscall surface — wait4 reaps the forked
          # child (status via the D15 uaccess walker), identity
          # syscalls, brk on the reserved heap run, anon mmap/munmap
          # round-trips with stub MAP/UNMAP ops.
          grep -q "WAIT4-OK" boot.log || { echo "M3.7 wait4 never reaped the child"; exit 1; }
          grep -q "PID-OK" boot.log || { echo "M3.7 getpid/getppid/set_tid_address failed"; exit 1; }
          grep -q "SIG-OK" boot.log || { echo "M3.7 rt_sigprocmask failed"; exit 1; }
          grep -q "BRK-OK" boot.log || { echo "M3.7 brk failed"; exit 1; }
          grep -q "MMAP-OK" boot.log || { echo "M3.7 mmap/munmap failed"; exit 1; }
          grep -q "SYSCALL-OK" boot.log || { echo "M3.7 syscall chain incomplete"; exit 1; }
          # M3.8 hazard 3: the fork answer re-protects the PARENT's
          # views read-only (upstream fork marks both pte tables RO);
          # the parent's later .data/heap writes fault into the COW
          # machinery and the child's surgery preserved the sharer's
          # bytes — the markers above now pass THROUGH that path.
          grep -q "fork: re-protected" boot.log || { echo "fork parent re-protect never queued"; exit 1; }
          echo "M1.9 NATIVE BOOT OK + M2 ROUND-TRIP OK + M3.1 FAULTS OK + M3.3 FORK OK + M3.4 ELF LOADER OK + M3.6 CONSOLE OK + M3.7 SYSCALLS OK"

      # M3.5 native mount gate: ubd0 opens the ext4 image through the
      # os-Windows fd table (NtCreateFile), sync do_io serves the reads,
      # ext4 mounts, /sbin/init (static, freestanding) is found in the
      # image. Since M3.8 S1 the boot fails FAST after that: the exec
      # dies at bprm_mm_init (no uml_nt_stub= → "mmctx: no stub path
      # configured") → panic → exit 1. Exit 1 or 124 (pre-S1 park)
      # both stay inside the assert; the log is the contract.
      - name: NATIVE ext4 mount gate (M3.5)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          # artifact downloads to <ws>/rootfs — two levels up from here
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          # MSYS2 rewrites POSIX-looking args (/dev/ubda → its own /dev
          # tree) when invoking native exes — exclude everything, and
          # use root=98:0 (decimal devt, no slashes; the format UML's
          # own default cmdline uses).
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "ubd0=$ROOTFS" "root=98:0" > mount.log 2>&1
          code=$?
          set -e
          cat mount.log
          [ "$code" -eq 124 ] || [ "$code" -eq 1 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "EXT4-fs (ubda): mounted filesystem" mount.log || { echo "ext4 never mounted (ubd sync I/O broken natively?)"; exit 1; }
          grep -q "VFS: Mounted root (ext4 filesystem)" mount.log || { echo "root never mounted"; exit 1; }
          grep -q "Run /sbin/init as init process" mount.log || { echo "/sbin/init never found in the mounted image"; exit 1; }
          grep -q "stdio console ready" mount.log || { echo "M3.6 console driver never registered"; exit 1; }
          echo "M3.5 NATIVE MOUNT OK: ubd sync I/O + ext4 + /sbin/init"

      # M3.8 S3 — binfmt_umlnt (D17): the ext4 /sbin/init (static,
      # freestanding) execs through do_execve → binfmt_umlnt → the S1
      # conn (VMA/spans) → the S2 userspace() loop serves it; the
      # guest init's write(2) reaches the console via the D16 dispatch
      # and exit(0) halts (panic → exit 1). Same rootfs image as the
      # mount gates — the marker proves the FULL exec chain.
      - name: NATIVE init-exec gate (M3.8 S3 binfmt_umlnt)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" > initexec.log 2>&1
          code=$?
          set -e
          cat initexec.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "EXT4-fs (ubda): mounted filesystem" initexec.log || { echo "ext4 never mounted (ubd sync I/O broken?)"; exit 1; }
          grep -q "Run /sbin/init as init process" initexec.log || { echo "/sbin/init never found"; exit 1; }
          grep -q "stdio console ready" initexec.log || { echo "M3.6 console driver never registered"; exit 1; }
          grep -q "binfmt_umlnt: init loaded" initexec.log || { echo "binfmt_umlnt load_binary never ran (exec failed earlier? see log)"; exit 1; }
          grep -q "INIT-SYSCALL-OK" initexec.log || { echo "guest init never wrote through the exec + userspace() path"; exit 1; }
          # M3.8 S4b: openat/read/close through the REAL guest VFS —
          # sys_call_table routing (upstream handle_syscall parity),
          # guest pointers valid via the D15 uaccess walker. The bytes
          # read back are /hi.sh — the script busybox runs in S4c.
          # The OPENAT-READ-OK line carries the escaped content
          # (human evidence); the hard proof is VFS-READ-VERIFIED — a
          # literal the script content never contains, printed by
          # init only when the read returned exactly /hi.sh's known
          # bytes (M4 hardening: marker split from the content line).
          grep -q "OPENAT-READ-OK: echo hi" initexec.log || { echo "S4b: openat/read never served through the real VFS (see [syscall] ENOSYS lines)"; exit 1; }
          grep -q "VFS-READ-VERIFIED" initexec.log || { echo "S4b: read bytes never verified against /hi.sh content (VFS-READ-VERIFIED absent)"; exit 1; }
          # M3.8 S4c: guest execve — the dispatch's kernel_execve
          # swaps the init task to /bin/step2 (conn switch: exec_mmap
          # destroys the old conn mid-round, the loop bootstraps the
          # new one from current_pt_regs).
          grep -q "STEP2-OK" initexec.log || { echo "S4c: guest execve never completed the conn switch (see [syscall] execve lines)"; exit 1; }
          # M3.8 S4c2: arch_prctl(ARCH_SET_FS) through the dispatch +
          # the stub's D18 re-apply — the %fs:0 read-back rides one
          # full syscall round-trip and only prints on a live TLS
          # base (Windows scheduling does not preserve one). The
          # anonymous mmap check is the musl malloc floor.
          grep -q "TLS-OK" initexec.log || { echo "S4c2: arch_prctl/D18 FS base never survived a syscall round-trip"; exit 1; }
          grep -q "MMAP-OK" initexec.log || { echo "S4c2: anonymous mmap (musl malloc floor) failed"; exit 1; }
          # M3.8 S4c2 acceptance POC: busybox sh (musl, linked in-window)
          # runs /hi.sh — two builtin echos; only busybox's own output
          # produces a BUSYBOX-SHELL-OK line WITHOUT the read marker
          # (the OPENAT-READ-OK line also shows the script bytes).
          grep -q "EXEC2-FAIL" initexec.log && { echo "step2: execve /bin/busybox failed"; exit 1; }
          grep "BUSYBOX-SHELL-OK" initexec.log | grep -qv "OPENAT-READ-OK" || { echo "busybox sh never ran the script (acceptance)"; exit 1; }
          echo "M3.8 S3+S4b+S4c NATIVE INIT-EXEC OK: binfmt_umlnt + userspace() + write(2) + openat/read VFS + execve chain + TLS + busybox sh echo hi"

      # M4.1: syscall RTT benchmark, clean path — /bin/bench runs as
      # PID 1 (init=/bin/bench, its own invocation: the POC chain
      # above stays untouched): BENCH_N getpid rounds between
      # kernel-recognized window markers (skas/bench.c opens/closes
      # the sampling window inside the write handler); the real
      # userspace() loop times every round (os_nsecs, wake-to-wake)
      # and prints ONE summary at END — zero per-round logging, the
      # distortion M3.9 called out is gone by construction. The
      # guest's BENCH-GUEST-CYCLES line is the rdtsc cross-check.
      # Perf numbers go to RESULTS.md; the gate asserts structure
      # (all rounds served) plus a 20x-headroom sanity ceiling —
      # NOT a perf gate.
      - name: NATIVE RTT bench gate (M4.1)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/bench" > bench.log 2>&1
          code=$?
          set -e
          cat bench.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "UMLNT-BENCH-BEGIN" bench.log || { echo "bench window never opened (guest marker write missing)"; exit 1; }
          grep -q "BENCH-KERNEL: rounds=8000 " bench.log || { echo "kernel window did not record all 8000 getpid rounds (dispatch dropped rounds?)"; exit 1; }
          grep -q "BENCH-GUEST-CYCLES: total=" bench.log || { echo "guest rdtsc cross-check line missing"; exit 1; }
          MEAN=$(grep -oE "mean_ns=[0-9]+" bench.log | head -1 | cut -d= -f2)
          [ -n "$MEAN" ] || { echo "mean_ns missing from BENCH-KERNEL summary"; exit 1; }
          [ "$MEAN" -lt 1000000 ] || { echo "RTT mean ${MEAN}ns above the 1ms sanity ceiling (per-round logging back? wait timeouts?)"; exit 1; }
          echo "M4.1 NATIVE BENCH OK: rounds=8000 recorded clean (no per-round log), mean ${MEAN}ns/syscall"

      # M4.2: block-wait through the scheduler — /bin/forkwait runs as
      # PID 1: fork goes through the GENERIC copy_process path (the
      # child = a real kernel task: cold stack at fork_handler, own
      # conn from init_new_context, own userspace() loop), so the
      # parent's wait4 BLOCKS (do_wait → schedule()) while the child's
      # stack runs, and the child's exit(7) does the real do_exit
      # teardown and wakes it. The marker ORDER is the proof: the POC
      # fork/wait4 (-EAGAIN retry, bare stub, no child task) cannot
      # produce CHILD-RUN between WAIT-BLOCK-ENTER and WAIT-OK.
      - name: NATIVE fork/wait4 block gate (M4.2)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/forkwait" > forkwait.log 2>&1
          code=$?
          set -e
          cat forkwait.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "FORK-PID: " forkwait.log || { echo "fork never returned a pid (copy_process failed? see fork: lines)"; exit 1; }
          grep -q "WAIT-BLOCK-ENTER" forkwait.log || { echo "parent never reached the blocking wait4"; exit 1; }
          grep -q "CHILD-RUN" forkwait.log || { echo "child kernel task never ran (scheduler never switched stacks?)"; exit 1; }
          grep -q "WAIT-OK: child reaped, exit 7" forkwait.log || { echo "wait4 did not reap the child with exit 7 (block path broken?)"; exit 1; }
          grep -q "FORKWAIT-OK" forkwait.log || { echo "fork/wait4 block gate incomplete"; exit 1; }
          # M4/S4d-a: the FP/XSTATE round-trip is live — the stub
          # captures the at-exception XSAVE_FORMAT block at every
          # trap, the kernel pulls it into regs->fp (one log line)
          # and pushes it back before every answer.
          grep -q "XSTATE-CAPTURED: 512 fp bytes" forkwait.log || { echo "S4d: xstate fp round-trip never captured (stub capture or protocol v6 broken?)"; exit 1; }
          echo "M4.2 NATIVE FORK-WAIT OK: real child task + blocking wait4 via schedule()"

      # M5.4 c3 (048 item 3): the fork/COW/recycled-run canary —
      # /bin/canary as PID 1, freestanding (NO systemd). Reproduces
      # the corruption surfaces the M5.5a SIGSEGV autopsy left open:
      # anon mmap must read back ZERO on every munmap/mmap recycle
      # cycle (a recycled run leaking bytes = the 044 family), and 8
      # fork rounds verify both directions of the COW contract (the
      # child sees the seed copy intact; the parent's arena never
      # carries the child's bytes — the "STREAM=7"-in-a-pointer-slot
      # injection class). A red canary with green markers above
      # closes recycled-run vs guest-logic from the log alone.
      - name: NATIVE fork/COW canary gate (M5.4 c3)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/canary" > canary.log 2>&1
          code=$?
          set -e
          cat canary.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code (guest died on its own? see SIGSEGV lines)"; exit 1; }
          grep -q "CANARY-INIT-OK" canary.log || { echo "canary: the fresh arena never verified (mmap/anon broken?)"; exit 1; }
          grep -q "CANARY-RECYCLE-OK" canary.log || { echo "canary: recycle cycles failed (recycled run leaked bytes = 044 family, or zero-contract broken)"; exit 1; }
          grep -q "CANARY-FORK-OK" canary.log || { echo "canary: fork/COW rounds failed (fork-seed copy torn or parent re-protect missing = the injection class)"; exit 1; }
          grep -q "CANARY-OK" canary.log || { echo "canary: incomplete"; exit 1; }
          echo "M5.4 C3 NATIVE CANARY OK: fresh-zero recycles + 8 fork/COW rounds verified both directions"

      # M4/S4d-b: signal fidelity — /bin/sigtest runs as PID 1: a NULL
      # store with magic XMM state faults; the kernel delivers a REAL
      # guest SIGSEGV (force_sig_fault → do_signal → setup_signal_
      # stack_si with the fpstate block from the trap capture); the
      # handler verifies the frame carries the XMM magics (fidelity
      # IN), clobbers XMM with anti-values, edits uc_mcontext.rip to
      # skip the faulting insn, and returns through the SA_RESTORER
      # trailer; rt_sigreturn restores GP+FP — the guest continues
      # with the ORIGINAL XMM values (fidelity OUT).
      - name: NATIVE signal/xstate gate (M4d)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/sigtest" > sigtest.log 2>&1
          code=$?
          set -e
          cat sigtest.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "SIGTEST-ARM" sigtest.log || { echo "sigtest never armed (init=/bin/sigtest failed to exec?)"; exit 1; }
          grep -q "SIGSEGV victim #" sigtest.log || { echo "the NULL store never became a guest SIGSEGV (fault kill path unchanged?)"; exit 1; }
          grep -q "SIGTEST-HANDLER" sigtest.log || { echo "the SIGSEGV handler never ran (delivery broken?)"; exit 1; }
          grep -q "SIGTEST-SI-OK" sigtest.log || { echo "siginfo code/addr wrong (force_sig_fault mapping?)"; exit 1; }
          grep -q "SIGTEST-FRAME-FP-OK" sigtest.log || { echo "the sigframe fpstate does not carry the trap's XMM state (fp capture → frame broken?)"; exit 1; }
          grep -q "SIGTEST-XMM-OK" sigtest.log || { echo "sigreturn did not restore the original XMM state (frame → restore broken?)"; exit 1; }
          grep -q "SIGTEST-XMM-ANTI-LEAK" sigtest.log && { echo "the handler's anti-magic XMM leaked through sigreturn"; exit 1; }
          grep -q "SIGTEST-OK" sigtest.log || { echo "sigtest did not complete (crash after sigreturn?)"; exit 1; }
          echo "M4d NATIVE SIGNAL OK: guest SIGSEGV delivered + fpstate fidelity in and out of the sigreturn frame"

      # M4 slice 4: multi-run heap growth — /bin/heaptest runs as PID 1:
      # brk(2) walks 24 runs (1.5 MiB) past the exec setup's ONE
      # pre-reserved 64K run. Every growth re-homes the heap in a fresh
      # contiguous span (one MapViewOfFileEx must cover the whole VMA;
      # the buddy owes no adjacency): contents memcpy kernel-side, the
      # VMA swaps to the new span, and UNMAP old / MAP new ops stream
      # to the stub. The gate's proof is content survival across the
      # copy chain (per-step magics at run ends), fresh-zero growth
      # areas (__GFP_ZERO backend), shrink + regrow, and one forced
      # re-home after the regrow.
      - name: NATIVE heap growth gate (M4 slice 4)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/heaptest" > heaptest.log 2>&1
          code=$?
          set -e
          cat heaptest.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "HEAP-GROW-OK" heaptest.log || { echo "the 24-run brk growth never verified its per-step magics (copy chain broken? see brk grow: lines)"; exit 1; }
          grep -q "HEAP-FRESH-ZERO-OK" heaptest.log || { echo "fresh growth area was not zero (backend no longer hands __GFP_ZERO spans?)"; exit 1; }
          grep -q "HEAP-SHRINK-OK" heaptest.log || { echo "brk shrink failed"; exit 1; }
          grep -q "HEAP-REGROW-OK" heaptest.log || { echo "brk regrow did not preserve contents"; exit 1; }
          grep -q "HEAPTEST-OK" heaptest.log || { echo "heaptest did not complete (forced re-home broke content?)"; exit 1; }
          grep -q "brk grow: heap" heaptest.log || { echo "no kernel-side growth logged (the guest never left the exec reservation — test vacuous?)"; exit 1; }
          echo "M4 SLICE4 NATIVE HEAP OK: brk grows multi-run (fresh span + contents kept + zeroed growth + shrink/regrow)"

      # M4 slice 5: page-granular MAP_FIXED guard materialized —
      # /bin/guardtest runs as PID 1: the musl mallocng call shape
      # mmap(heap_base, 4096, PROT_NONE, MAP_FIXED) inside the heap
      # VMA now arms a REAL NOACCESS region (kernel guard state +
      # NOACCESS view op). A store into it faults SIGSEGV with
      # SEGV_ACCERR (the guard state kills the fault — never
      # auto-repaired); the handler answers like a real allocator:
      # SUB-RUN mprotect(RW) kills the guard + fixes the view; the
      # store replays through sigreturn (rip restored unchanged) and
      # succeeds; a neighbour page stays live.
      - name: NATIVE guard tripwire gate (M4 slice 5)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/guardtest" > guardtest.log 2>&1
          code=$?
          set -e
          cat guardtest.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "GUARD-PLACE-OK" guardtest.log || { echo "the sub-run PROT_NONE MAP_FIXED never returned its VA (mmap path broken?)"; exit 1; }
          grep -q "GUARD-TRIP-OK" guardtest.log || { echo "the guard write never became SIGSEGV ACCERR at the guard addr (guard state not armed, or the fault was auto-repaired?)"; exit 1; }
          grep -q "GUARD-REPLAY-OK" guardtest.log || { echo "the store never replayed after the handler's sub-run mprotect + sigreturn"; exit 1; }
          grep -q "GUARD-NEIGHBOR-OK" guardtest.log || { echo "the page next to the guard was damaged (the guard leaked beyond 4K?)"; exit 1; }
          grep -q "GUARDTEST-OK" guardtest.log || { echo "guardtest did not complete"; exit 1; }
          echo "M4 SLICE5 NATIVE GUARD OK: sub-run PROT_NONE MAP_FIXED + mprotect materialized (trip -> ACCERR -> unprotect -> replay)"

      # M4 final gate: the REAL sysbench cpu workload (sb_cpu.c's
      # cpu_execute_event 1:1 — double-sqrt trial-division prime sweep
      # to the sysbench default 10000, one event per sweep) runs as
      # PID 1 behind a 10s CLOCK_MONOTONIC window (kernel clock_
      #_gettime syscall, QPC-backed). The M4-done bar: eps >= 2100
      # (1/3 of the Linux mark band 2100-3500 was sized against; the
      # guest prints its exact eps for RESULTS.md). The sweep's prime
      # count is deterministic (1228) — a wrong count means the
      # compute was not real. Boot-to-PID-1 stays seconds-fast (the
      # <= 5 min M4-done criterion; the step's own wall time is the
      # record).
      - name: NATIVE sysbench cpu gate (M4 final)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/sysbench" > sysbench.log 2>&1
          code=$?
          set -e
          cat sysbench.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "SYSBENCH-OK" sysbench.log || { echo "sysbench did not complete (clock_gettime broken? see the run log)"; exit 1; }
          grep -q "PRIMES=1228" sysbench.log || { echo "the prime sweep count is wrong (compute not real or ABI skew?)"; exit 1; }
          grep -q "total number of events: " sysbench.log || { echo "no event total printed"; exit 1; }
          EPS=$(grep -oE "events per second: [0-9]+" sysbench.log | head -1 | grep -oE "[0-9]+")
          [ -n "$EPS" ] || { echo "eps missing from the sysbench summary"; exit 1; }
          [ "$EPS" -ge 2100 ] || { echo "sysbench cpu ${EPS} eps BELOW the 1/3-Linux-mark floor (2100) — perf regress or slow runner?"; exit 1; }
          echo "M4 FINAL NATIVE SYSBENCH OK: real cpu workload, ${EPS} eps (>= 2100 = the 1/3 Linux-mark floor)"

      # M5.1a: winsock through the D9 table (ntabi v2) — the freestanding
      # kernel dials a framed TCP echo server on loopback and round-trips
      # a 512-byte payload. This is the kernel↔netstack channel shape
      # (D8: TCP localhost, 2-byte BE length prefix per frame — the
      # protocol vdeplug-go's own TCP transport speaks); the netstack
      # helper itself arrives at M5.1b.
      - name: NATIVE TCP probe gate (M5.1a)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          python ../probes/tcp_echo.py 19292 > echo.log 2>&1 & SRV=$!
          sleep 1
          set +e
          timeout 90 ./launcher.exe ../../build/vmlinux \
            "uml_nt_netprobe=127.0.0.1:19292" > netprobe.log 2>&1
          code=$?
          set -e
          kill $SRV 2>/dev/null
          cat netprobe.log echo.log
          [ "$code" -eq 1 ] || { echo "expected exit 1 (panic after probe), got $code"; exit 1; }
          grep -q "NETPROBE-DIAL-OK" netprobe.log || { echo "kernel never dialed the echo server (winsock via D9 v2 broken? see log)"; exit 1; }
          grep -q "NETPROBE-TCP-OK 512 bytes" netprobe.log || { echo "framed round-trip never completed (framing/stream bug? see log)"; exit 1; }
          grep -q "NETPROBE-FAIL" netprobe.log && { echo "probe reported failure"; exit 1; }
          echo "M5.1a NATIVE TCP PROBE OK: freestanding kernel dialed + framed round-trip via ws2_32"

      # M5.1b/c: the netstack helper — vdeplug-go compiled for the
      # runner (netstack.exe, D8 direct p2p mode: tcplisten:// +
      # slirp:// uplink). Committed go.mod/go.sum (the known-good
      # floor; the dedicated vdeplug_go.yml floats deps weekly).
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build netstack.exe (vdeplug-go, D8 helper)
        # default (PowerShell) shell — setup-go's PATH doesn't reach
        # the msys2 login environment, and the msys2 shell below only
        # consumes the artifact.
        run: |
          cd vdeplug-go
          $env:CGO_ENABLED = '0'; $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o ..\uml-nt\launcher\netstack.exe .
          Get-Item ..\uml-nt\launcher\netstack.exe

      # M5.1c/d: the vector device end to end — the kernel spawns
      # netstack.exe (uml_nt_netstack=), dials the D8 TCP channel
      # (vec0:transport=vde,vnl=...), the guest's udhcpc leases
      # through it (vector TX ring → helper DHCP → OFFER/ACK → the
      # D19 reader ring → the guest IP stack) and pings the NAT
      # gateway (10.0.2.2 — slirp parity). M5.1d: the gateway address
      # NATs to host loopback, so /bin/nettest's wget reaches an HTTP
      # server ON THE RUNNER (the deterministic "internet") — the
      # first guest TCP download out of the machine. PID 1 =
      # /bin/netsetup, which execve()s busybox sh onto /net.sh (the
      # applet markers are the evidence; PID 1 exit = the usual panic
      # exit 1).
      - name: NATIVE net gate (M5.1c + M5.1d)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          NETSTACK=$(cygpath -w "$(pwd)/netstack.exe")
          # M5.1d: the file the guest fetches via wget through the NAT.
          mkdir -p srvroot
          printf 'uml-nt-net-ok\n' > srvroot/netok.txt
          python -m http.server 19293 --directory srvroot > http.log 2>&1 & SRV=$!
          sleep 1
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "uml_nt_netstack=$NETSTACK" \
            "ubd0=$ROOTFS" "root=98:0" \
            "vec0:transport=vde,vnl=127.0.0.1:9100" \
            "init=/bin/netsetup" > net.log 2>&1
          code=$?
          set -e
          kill $SRV 2>/dev/null
          cat net.log http.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code (boot hung elsewhere? see log)"; exit 1; }
          grep -q "net: dialed 127.0.0.1:9100" net.log || { echo "kernel never dialed the netstack channel (helper spawn / D8 dial broken? see log)"; exit 1; }
          grep -q "NET-LEASE-OK" net.log || { echo "udhcpc never got a lease (vector TX / DHCP path / reader ring broken? see [syscall] ENOSYS lines)"; exit 1; }
          grep -q "NET-PING-GW-OK" net.log || { echo "ping gateway never answered (ICMP through the NAT broken? see log)"; exit 1; }
          grep -q "NET-GET-OK" net.log || { echo "M5.1d: wget never fetched/verified the body through the NAT (guest TCP out broken? see net.log + http.log access lines)"; exit 1; }
          grep -q "M5 NET OK" net.log || { echo "M5.1d: the net chain did not complete (see the NET-* markers above)"; exit 1; }
          grep -q "NET-WGET-FAIL\|NET-BODY-MISMATCH\|NETTEST-FAIL" net.log && { echo "M5.1d: nettest reported failure"; exit 1; }
          echo "M5.1c/d NATIVE NET OK: vec0 up + udhcpc lease + ping gateway + wget through the NAT (guest TCP out to the runner)"

      # M5.1e: host -> guest port forwarding — the Linux launcher's
      # config.yaml parity, natively. vdeplug-go resolves its config
      # from the EXECUTABLE's directory, so dropping config.yaml next
      # to netstack.exe is the whole wiring: the kernel cmdline stays
      # untouched. EVIDENCE PROBE, NOT A GATE (the S4c rule): the
      # chain crosses the guest's INBOUND TCP surface (listen/accept
      # through vec0), which no prior gate exercised — the connection
      # + marker is the proof; a miss prints the story and the step
      # goes on (continue-on-error) while the sample decides.
      - name: NATIVE portfwd probe (M5.1e evidence)
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          # a stale helper from a timed-out earlier boot would still
          # own the channel port — take it down first.
          taskkill //F //IM netstack.exe >/dev/null 2>&1 || true
          # the whole feature: one file next to the binary.
          cp netstack-config.example.yaml config.yaml
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          NETSTACK=$(cygpath -w "$(pwd)/netstack.exe")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "uml_nt_netstack=$NETSTACK" \
            "ubd0=$ROOTFS" "root=98:0" \
            "vec0:transport=vde,vnl=127.0.0.1:9100" \
            "init=/bin/netfwd" > netfwd.log 2>&1 &
          BOOT=$!
          # the guest leases + parks its nc listener; the probe
          # retries until the marker rides the forward back out.
          python ../probes/portfwd_check.py 127.0.0.1 2222 \
            > portfwd-check.log 2>&1
          CHK=$?
          wait $BOOT; code=$?
          set -e
          cat netfwd.log portfwd-check.log
          echo "boot exit: $code (1 = nc served + init exited; 124 = nothing connected), probe exit: $CHK"
          grep -q "NETFWD-LEASE-OK" netfwd.log || { echo "M5.1e: the guest never leased (net bring-up broken in this boot — read the log)"; exit 1; }
          grep -q "PORTFWD-CONN-OK" portfwd-check.log || { echo "M5.1e: the host->guest forward did not complete (inbound guest TCP still unproven — read the try-by-try lines)"; exit 1; }
          echo "M5.1e NATIVE PORTFWD OK: host :2222 -> helper listener -> netstack dial -> guest 10.0.2.15:22 (busybox nc marker returned)"

      # M5.4 cluster 1 (D20): dynamic-PIE — binfmt_umlnt parses
      # PT_INTERP (/bin/dyntest is ET_DYN, PIE), reads the interpreter
      # through the guest VFS, loads it as a SECOND ET_DYN image
      # (first-fit above the app), starts it at the interp entry with
      # the full auxv (AT_PHDR/AT_PHENT/AT_PHNUM/AT_BASE/AT_ENTRY/
      # ids/AT_RANDOM/AT_PAGESZ), and ld-musl self-relocates, sets
      # TLS (arch_prctl, D18) and jumps to AT_ENTRY. DYNTASK-OK is
      # the app's own write — the whole chain's evidence.
      - name: NATIVE dynamic-PIE gate (M5.4 c1)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/dyntest" > dyn.log 2>&1
          code=$?
          set -e
          cat dyn.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code (boot hung elsewhere? see log)"; exit 1; }
          grep -q "binfmt_umlnt: interp /lib/ld-musl-x86_64.so.1 requested" dyn.log || { echo "PT_INTERP never parsed (the loader missed the interp segment? see log)"; exit 1; }
          grep -q "interp loaded base" dyn.log || { echo "the interpreter never loaded as the second image"; exit 1; }
          grep -q "DYNTASK-OK" dyn.log || { echo "ld-musl never jumped to AT_ENTRY / the app never ran (auxv or self-reloc broken? see [syscall] ENOSYS lines)"; exit 1; }
          grep -q "DYNTASK-FAIL" dyn.log && { echo "the dyn app reported failure"; exit 1; }
          echo "M5.4 C1 NATIVE DYNPIE OK: PT_INTERP parsed + interp loaded as second image + full-auxv start to the app"

      # M5.4 cluster 2 (D20): dynamic LIBS — PID 1 (/bin/dynsetup,
      # static) execve()s the DYNAMIC busybox (/bin/busybox-dyn, musl:
      # PT_INTERP ld-musl + DT_NEEDED libc.so). The loader resolves
      # libc.so against itself (musl one-file-both — the DT_NEEDED
      # handshake end to end), and the app's own console write is the
      # evidence. The glibc side (ld.so mapping libc.so.6 through the
      # file-backed mmap + the D20 exec sweep) runs against the PVE
      # image locally — no image artifact in CI (hard rule).
      - name: NATIVE dynamic-libs gate (M5.4 c2)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/dynsetup" > dynlib.log 2>&1
          code=$?
          set -e
          cat dynlib.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code (boot hung elsewhere? see log)"; exit 1; }
          grep -q "binfmt_umlnt: interp /lib/ld-musl-x86_64.so.1 requested" dynlib.log || { echo "the dynamic busybox never reached binfmt_umlnt (exec chain broken? see log)"; exit 1; }
          grep -q "interp loaded base" dynlib.log || { echo "the interpreter never loaded as the second image for busybox-dyn"; exit 1; }
          grep -q "DYNBUSY-OK" dynlib.log || { echo "the dynamic busybox never ran (ld-musl DT_NEEDED handshake broken? see [syscall] ENOSYS lines)"; exit 1; }
          grep -q "DYNSETUP-EXEC-FAIL\|DYNBUSY-FAIL" dynlib.log && { echo "the dyn chain reported failure"; exit 1; }
          echo "M5.4 C2 NATIVE DYNLIB OK: static PID 1 -> dynamic busybox (ld-musl interp + DT_NEEDED libc.so) ran to its own console write"

      # M5.4 c2 cluster glibc (D20 cluster 2): the REAL glibc startup,
      # natively — /bin/true + ld-linux + libc.so.6 copied from the
      # runner itself into the rootfs (no image artifact; the PVE
      # image's /bin/true is the same shape, local-only). The full
      # ld.so sequence: cache mmap (file-backed PROT_READ) → ldso
      # malloc (anon) → libc.so.6 span mmap + per-segment MAP_FIXED
      # refills + the D20 exec sweep → bss zero refill → TLS
      # (arch_prctl) → set_robust_list/prlimit64/rseq → exit_group(0)
      # — the init-exit panic with exitcode 0x00000000 is the "ran
      # fully" marker (the only exit a PID-1 /bin/true can print).
      - name: NATIVE glibc gate (M5.4 c2)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" "init=/bin/true" > glibc.log 2>&1
          code=$?
          set -e
          cat glibc.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code (boot hung elsewhere? see log)"; exit 1; }
          grep -q "binfmt_umlnt: interp /lib64/ld-linux-x86-64.so.2 requested" glibc.log || { echo "the glibc binary never reached binfmt_umlnt (exec chain broken? see log)"; exit 1; }
          grep -q "mmap file.*-> fresh" glibc.log || { echo "ld.so never mapped a library through the file-backed mmap path (M5.4 c2 broken?)"; exit 1; }
          grep -q "mmap exec sweep.*syscall(s) patched (D20)" glibc.log || { echo "the libc text segment was never swept at map time (D20 exec-sweep hook broken?)"; exit 1; }
          grep -q "arch_prctl(SET_FS" glibc.log || { echo "ld.so never set its TLS (startup stopped before TLS init? see [syscall] ENOSYS lines)"; exit 1; }
          grep -q "Attempted to kill init! exitcode=0x00000000" glibc.log || { echo "/bin/true did not exit 0 (glibc startup failed mid-way? see the error lines + [syscall] ENOSYS lines in the log)"; exit 1; }
          grep -q "cannot\|error while loading" glibc.log && { echo "the glibc loader reported failure"; exit 1; }
          echo "M5.4 C2 NATIVE GLIBC OK: ld-linux + libc.so.6 through the file-backed mmap + D20 sweep + TLS, /bin/true exit 0"

      # Shelley (vận hành): the real-machine user needs a matching-
      # version download — every run uploads the SAME binaries that
      # just passed these gates (launcher + stub + netstack), next to
      # the kernel job's vmlinux.elf. always() = the set ships even
      # when a late gate went red (the binaries still built).
      - name: Upload windows binaries (launcher + stub + netstack)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-windows-bin
          path: |
            uml-nt/launcher/launcher.exe
            uml-nt/launcher/netstack.exe
            uml-nt/stub/stub.exe
          if-no-files-found: error

  systemd-boot:
    # The M5.5a/M5.5b referee (was uml-nt-m55-systemd.yml's boot job).
    # Never on a plain push: dispatch (the A/B levers), the weekly
    # canary, or the UML_NT_BOOT_ON_PUSH opt-in — see the header.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.UML_NT_BOOT_ON_PUSH == '1'
    needs: [kernel, rootfs-mask]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-toolchain

      - name: Build launcher.exe + stub.exe
        shell: msys2 {0}
        run: |
          make -C uml-nt/launcher all
          make -C uml-nt/stub all

      - name: Download vmlinux.elf
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build

      # The systemd rootfs = the kernel job's MASKED CI copy of
      # base-debian-bookworm.img (Debian 12 cloud, systemd 252,
      # root:root, getty@tty0, fstab /dev/ubda; cloud-init units masked
      # per the D21 test-image rule). Never committed — hard rule.
      - name: Download masked rootfs (CI copy)
        uses: actions/download-artifact@v4
        with:
          name: m55a-rootfs-bookworm-masked
          path: rootfs-img
      - name: Verify masked rootfs landed
        shell: msys2 {0}
        run: ls -lh rootfs-img

      - name: WER LocalDumps for stub.exe (diagnostics only)
        shell: powershell
        run: |
          # Shelley 188: when a process dies unhandled, WER can write a
          # dump that carries the REAL exception record — code, address
          # and the thread context at death, including exceptions the
          # user-mode handlers never saw. Diagnostics only; it does not
          # touch the gate.
          $dir = Join-Path $env:RUNNER_TEMP "uml-dumps"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\stub.exe"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value $dir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          Write-Host "LocalDumps -> $dir (Type=2 full)"

      - name: NATIVE systemd boot (M5.5a + M5.5b-1 login feed)
        shell: msys2 {0}
        env:
          # Shelley 219: a dump after the death never returns, so the stub
          # photographs itself every two seconds and keeps the last three.
          # the snapshots found no death to photograph and cost the run
          # thousands of files; off while the gate is what matters.
          UML_NT_DUMP_MS: "0"
          # Shelley 242: census of every thread in the stub process, with
          # start address and CPU time, so a thread that is not ours can be
          # named instead of guessed at.
          UML_NT_CENSUS: "1"
        run: |
          cd uml-nt/launcher
          set +e
          # 900s (was 420): mem=120M boots go deeper than the old cap
          # could film — the evidence must land before the kill.
          # SYSTEMD_LOG_TARGET=console: init's assert/emergency text
          # defaults to the journald socket — silent when that path
          # misbehaves ("Caught <ABRT>" with NO assertion line before
          # it, run 36804503133). Console target puts the failing
          # assert on the log we actually read.
          #
          # M5.5b-1: TRICKLE the login attempt every ~25s. Run
          # 37009489525: a t=60s feed was GONE before the t~9min
          # "uml login:" prompt (agetty's line setup flushes the
          # queue) — pre-prompt attempts are flushed harmlessly, the
          # first attempt after the prompt logs in, later ones are
          # shell noise (echo LOGIN-OK is idempotent). The designed
          # EOF "park loud" lands when the launcher dies.
          WITNESS_ARG=""
          if [ "${{ inputs.witness_off }}" = "true" ]; then
            WITNESS_ARG="uml_nt_witness=0"
          fi
          XSLEV_ARG=""
          if [ "${{ inputs.xs_lever }}" = "true" ]; then
            XSLEV_ARG="uml_nt_xslever=1"
          fi
          PROBE_ARG=""
          if [ "${{ inputs.probe_off }}" = "true" ]; then
            PROBE_ARG="uml_nt_drexec=0"
          fi
          DBG_ARG=""
          if [ "${{ inputs.debugger }}" = "true" ]; then
            DBG_ARG="uml_nt_dbg=1"
          fi
          VW_ARG=""
          if [ "${{ inputs.veh_window }}" = "true" ]; then
            VW_ARG="uml_nt_vehwin=1"
          fi
          # Shelley 245: capture only the window that matters. The trace is
          # armed the moment the kernel logs the login exec and stopped as
          # soon as a death appears, so the file stays small enough to convert
          # inside a step instead of dying on a hundred and twenty megabytes.
          ETL=$(cygpath -w "$PWD/../uml-kproc.etl")
          (
            for _ in $(seq 1 600); do
              if grep -q "login chain armed" systemd.log 2>/dev/null; then
                logman.exe start umlnt -ets -p Microsoft-Windows-Kernel-Process 0x10 \
                  -o "$ETL" -ct perf -f bin -max 64 -bs 64 -ft 1 >/dev/null 2>&1 \
                  && echo "[etw] armed at $(date +%H:%M:%S)" >> etw-trace.log
                break
              fi
              sleep 1
            done
            for _ in $(seq 1 900); do
              if grep -q "died silently" systemd.log 2>/dev/null; then
                sleep 2
                logman.exe stop umlnt -ets >/dev/null 2>&1 \
                  && echo "[etw] stopped at $(date +%H:%M:%S) (death seen)" >> etw-trace.log
                exit 0
              fi
              sleep 1
            done
          ) &
          ETW_WATCH=$!
          {
            i=0
            while [ $i -lt 36 ]; do
              if [ "${{ inputs.feed }}" != "false" ]; then
                printf 'root\n'; sleep 1
                printf 'root\n'; sleep 1
                printf 'echo LOGIN-OK\n'
                sleep 23
              else
                sleep 26
              fi
              i=$((i+1))
            done
          # -k 30: if the launcher ignores TERM we still get the log back —
          # an instrument that can hang forever costs the whole run's
          # evidence (referee 40794805029 lost everything at 1h01m).
          } | timeout -k 30 ${{ inputs.debugger && '1800' || '900' }} ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$(cygpath -w ../../rootfs-img/base-debian-bookworm.img)" \
            "mem=120M" \
            "root=98:0" "rw" \
            "SYSTEMD_LOG_TARGET=console" "SYSTEMD_LOG_LOCATION=1" \
            ${WITNESS_ARG:+$WITNESS_ARG} \
            ${PROBE_ARG:+$PROBE_ARG} \
            ${XSLEV_ARG:+$XSLEV_ARG} \
            ${DBG_ARG:+$DBG_ARG} ${VW_ARG:+$VW_ARG} \
            > systemd.log 2>&1
          code=$?
          set -e
          logman.exe stop umlnt -ets >/dev/null 2>&1 || true
          cat etw-trace.log 2>/dev/null || true
          echo "launcher exit: $code (124 = still running at timeout — expected while systemd boots)"
          echo "--- first 25 log lines (ubd attach / early boot) ---"
          head -25 systemd.log
          echo "--- exec chain ---"
          grep -E "execve\(|binfmt_umlnt:" systemd.log | head -40 || true
          # boot-failure-driven: the evidence table first.
          echo "--- not-implemented syscall table (this boot) ---"
          grep "not implemented" systemd.log \
            | sed 's/^\[syscall\] nr=//; s/ not implemented.*//' \
            | sort -n | uniq -c | sort -rn | head -40 || true
          echo "--- last 30 log lines ---"
          tail -30 systemd.log
          echo "--- last console writes from the guest ---"
          grep -E "^\[syscall\] (write|writev|openat|open|execve)" systemd.log | tail -25 || true
          # Gate (D21 era): multi-user.target, fallback journald Started.
          # The env-poison/_strv_env_merge SIGSEGV family still kills
          # ~1/3 of boots pre-journald (COW-repair multi-page suspicion,
          # hunt separate) — a red flake run is re-dispatched for
          # sampling, not treated as a regression. Same ANSI-color
          # lesson as below: "Started <color>Journal Service</color>."
          # never matches the literal — match across the codes.
          if grep -q "Reached target.*Multi-User System" systemd.log; then
            echo "M5.5a GATE OK: multi-user.target reached"
          elif grep -qE "Started.*Journal Service|Journal started" systemd.log; then
            echo "M5.5a GATE OK (fallback): journald Started — multi-user not yet, read the evidence table above"
          else
            echo "M5.5a GATE MISS: neither multi-user.target nor journald Started — boot died before journald"
            exit 1
          fi
          # M5.5b-1 gate (1/3): console-getty login root/root via PAM.
          # The marker = the fed `echo LOGIN-OK` reaching the console
          # log — a shell ran it, so getty + PAM auth + a login shell
          # all worked. Same ANSI lesson: match at line start, the
          # fed command's echo may colorize nothing (raw bytes in).
          if grep -q "^LOGIN-OK" systemd.log; then
            echo "M5.5b-1 GATE OK: root login via console-getty (PAM + shell)"
          else
            echo "M5.5b-1 GATE MISS: no LOGIN-OK marker — login did not complete (termios/ioctl ENOSYS hunt likely, read the syscall table)"
            exit 1
          fi
          # M5.5b close rule (Shelley, after the "green" 36984931372
          # died post-gate): a milestone-closing run may NOT die after
          # the marker — the log from the marker on must be clean of
          # kernel/guest death, or the boot ended only after the fed
          # shell job completed (the designed park-loud EOF is fine).
          MK=$(grep -n "^LOGIN-OK" systemd.log | head -1 | cut -d: -f1)
          if [ -n "$MK" ] && tail -n +"$MK" systemd.log \
              | grep -qE "Caught <|Freezing|KERNEL NATIVE FAULT"; then
            echo "M5.5b GATE MISS: post-marker death in the log (the 36984931372 class) — a milestone cannot close on this run"
            exit 1
          fi
          # Close procedure (not automatable here): the M5.5b gates
          # must pass in TWO CONSECUTIVE runs before the milestone
          # closes — re-dispatch and confirm, tracked in STATUS.

      - name: Windows error events (faulting module + offset)
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          # Shelley 246: WER dumps never appeared on this runner, but the
          # Application log still records an event 1000 for an unhandled
          # exception, and that record names the FAULTING MODULE and the
          # offset inside it — the one fact seventeen dumps could not give.
          $since = (Get-Date).AddMinutes(-40)
          try {
            $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=$since} -ErrorAction Stop
            Write-Host "app error events: $($ev.Count)"
            foreach ($e in $ev | Select-Object -First 10) {
              Write-Host "--- $($e.TimeCreated.ToString('o')) id=$($e.Id)"
              Write-Host $e.Message
            }
          } catch { Write-Host "no application error events: $($_.Exception.Message)" }
          try {
            $ev2 = Get-WinEvent -FilterHashtable @{LogName='System'; Id=1000; StartTime=$since} -ErrorAction SilentlyContinue
            foreach ($e in $ev2 | Select-Object -First 5) { Write-Host "sys1000 $($e.TimeCreated.ToString('o')) $($e.Message)" }
          } catch { }

      - name: ETW window (convert + find the victim)
        if: always()
        shell: powershell
        timeout-minutes: 20
        continue-on-error: true
        run: |
          # Shelley 245: the trace is now a window, not the whole boot, so a
          # conversion fits in a step. The victim's pid is read from this
          # run's own log and matched in BOTH spellings — a decimal pid and a
          # hex pid have already caused one silent miss.
          $etl = "uml-nt\uml-kproc.etl"
          if (!(Test-Path $etl)) { Write-Host "no etl: $etl"; exit 0 }
          Get-Item $etl | Format-List Name,Length | Out-String | Write-Host
          logman query umlnt -ets 2>&1 | Out-String | Write-Host
          $csv = Join-Path $env:RUNNER_TEMP "uml-kproc.csv"
          tracerpt "$etl" -of CSV -o $csv -y 2>&1 | Select-Object -Last 2 | Out-String | Write-Host
          if (!(Test-Path $csv)) { Write-Host "tracerpt produced no csv"; exit 0 }
          $lines = Get-Content $csv
          Write-Host "csv lines: $($lines.Count)"
          $m = Select-String -Path "uml-nt\launcher\systemd.log" -Pattern 'exit-req\] pid (\d+)' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$m) { Write-Host "victim pid not found in the log"; exit 0 }
          $dec = [int]$m.Matches[0].Groups[1].Value
          $hex = '0x{0:X}' -f $dec
          $hex4 = '0x{0:X4}' -f $dec
          Write-Host "victim pid $dec ($hex / $hex4)"
          $hits = $lines | Select-String -Pattern @($hex, $hex4, "\b$dec\b") -SimpleMatch:$false
          Write-Host "victim rows: $($hits.Count)"
          $hits | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
          $out = Join-Path $env:RUNNER_TEMP "uml-kproc-victim.txt"
          $hits | ForEach-Object { $_.Line } | Set-Content $out
          # the stop events of the last twenty seconds are the scene of the crime
          Write-Host "--- last 20 Stop rows ---"
          $lines | Select-String -Pattern ', *Stop *,' | Select-Object -Last 20 | ForEach-Object { Write-Host $_.Line }

      - name: Upload systemd.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m55a-systemd-log-${{ github.run_id }}
          path: uml-nt/launcher/systemd.log

      - name: Collect stub self-snapshots from %TEMP% (Windows temp, not runner.temp)
        if: always()
        shell: pwsh
        run: |
          $dst = "uml-nt/launcher"
          $n = 0
          # the msys2 TEMP is where the stub (a msys2 child) writes, and it is
          # not $env:TEMP of this shell — collect from both
          $globs = @("$env:TEMP\stub-loop-*.dmp","$env:TEMP\stub-death-*.dmp",
                     "D:\a\_temp\msys64\tmp\stub-loop-*.dmp",
                     "D:\a\_temp\msys64\tmp\stub-death-*.dmp")
          Get-ChildItem $globs -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $dst -Force
            Write-Host "collected $($_.Name) $($_.Length) bytes"
            $n++
          }
          Write-Host "stub snapshots collected: $n"

      - name: Upload WER dumps + last-chance record (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m55a-wer-dumps-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/uml-dumps/*.dmp
            ${{ runner.temp }}/stub-death-*.dmp
            ${{ runner.temp }}/stub-loop-*.dmp
            stub-death-*.dmp
            stub-loop-*.dmp
            uml-nt/launcher/stub-*.dmp
            uml-nt/launcher/stub-unhandled.txt
          if-no-files-found: warn
